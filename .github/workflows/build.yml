name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SUS.Atomic.Client/SUS.Atomic.Client.sln
    
    - name: Build
      run: dotnet build SUS.Atomic.Client/SUS.Atomic.Client.sln --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test SUS.Atomic.Client/SUS.Atomic.Client.sln --configuration Release --no-build --verbosity normal
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          SUS.Atomic.Client/**/bin/Release/*.nupkg
          SUS.Atomic.Client/**/bin/Release/*.snupkg
        retention-days: 7
